---
name: Tests

# Replays every captured packet in docs/packets/references through the packet
# classes (DqxClarity.Tests). Windows runner because the app targets
# net9.0-windows. The native DLLs aren't built here: the app project only embeds
# them when they exist, and the packet classes don't need them.
on:
  pull_request:
  push:
    branches: [main]

jobs:
  test:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '9.0.x'

      - name: Run packet tests
        run: dotnet test DqxClarity.Tests --logger "console;verbosity=normal"
